<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* https://*.googleapis.com https://*.firebaseio.com; font-src 'self'">
<title>إدارة سمان ههيا</title>
<link rel="stylesheet" href="../shared/vendor/cairo.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#14532d;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
main{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0;font:inherit}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;background:#14532d;color:#fff}
button.gray{background:#64748b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.err{color:#b91c1c;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{background:#e2e8f0;color:#0f172a}.tabs button.on{background:#14532d;color:#fff}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e2e8f0}
</style></head><body>
<header><b>إدارة سمان ههيا</b><button id="out" class="gray hidden">خروج</button></header>
<main>
<section id="login" class="card"><b>دخول المسؤول</b><input id="email" type="email" dir="ltr" placeholder="البريد"><input id="pass" type="password" dir="ltr" placeholder="كلمة السر">
 <button id="go">دخول</button><p id="lerr" class="err"></p></section>
<section id="app" class="hidden">
 <div class="tabs" id="tabs"><button data-t="orders" class="on">الطلبات</button><button data-t="cash">تأكيد النقدية</button><button data-t="couriers">المناديب</button><button data-t="catalog">الأسعار والمخزون</button></div>
 <div id="orders"></div><div id="cash" class="hidden"></div>
 <div id="couriers" class="hidden"><div class="card"><b>إضافة مندوب</b><input id="cname" placeholder="الاسم"><input id="cphone" dir="ltr" placeholder="رقم الموبايل"><input id="cpass" dir="ltr" placeholder="كلمة سر (6 على الأقل)"><button id="cadd">إنشاء الحساب</button><p id="cerr" class="err"></p></div><div id="clist"></div></div>
 <div id="catalog" class="hidden"><div class="card"><b>الأسعار</b><div id="pbox"></div><b>المخزون</b><div id="sbox"></div><button id="csave">حفظ</button></div></div>
</section></main>
<script src="../shared/vendor/firebase-app-compat.js"></script>
<script src="../shared/vendor/firebase-auth-compat.js"></script>
<script src="../shared/vendor/firebase-firestore-compat.js"></script>
<script src="../shared/config.js"></script>
<script src="app.js"></script></body></html>
