<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* https://*.googleapis.com https://*.firebaseio.com; font-src 'self'">
<title>تطبيق المندوب</title>
<link rel="stylesheet" href="../shared/vendor/cairo.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#065f46;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
main{padding:12px;max-width:560px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0;font:inherit;direction:ltr;text-align:left}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#065f46;color:#fff}
button.warn{background:#b45309}button.gray{background:#64748b}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e2e8f0}.err{color:#b91c1c;font-size:13px}.hidden{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:#e2e8f0;color:#0f172a}.tabs button.on{background:#065f46;color:#fff}
</style></head><body>
<header><b>تطبيق المندوب</b><button id="out" class="gray hidden">خروج</button></header>
<main>
 <section id="login" class="card"><b>تسجيل الدخول</b>
  <input id="phone" inputmode="tel" placeholder="رقم الموبايل" autocomplete="username">
  <input id="pass" type="password" placeholder="كلمة السر (6 أحرف أو أرقام على الأقل)" autocomplete="current-password">
  <button id="go" style="width:100%">دخول</button><p id="lerr" class="err"></p></section>
 <section id="app" class="hidden">
  <div class="tabs"><button data-f="active" class="on">قيد التوصيل</button><button data-f="no_answer">لم يرد</button><button data-f="completed">تم التسليم</button></div>
  <div id="list"></div>
  <div id="remit" class="card hidden"><div>نقدية لم يُبلَّغ بتسليمها: <b id="cash">0</b> ج</div><button id="remitBtn" style="width:100%;margin-top:8px">أبلغت بتسليم النقدية (بانتظار تأكيد المسؤول)</button></div>
 </section>
</main>
<script src="../shared/vendor/firebase-app-compat.js"></script>
<script src="../shared/vendor/firebase-auth-compat.js"></script>
<script src="../shared/vendor/firebase-firestore-compat.js"></script>
<script src="../shared/config.js"></script>
<script src="app.js"></script>
</body></html>
